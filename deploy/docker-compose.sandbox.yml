services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sandbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the published backend image}:${BACKEND_TAG:?Set BACKEND_TAG to an immutable published tag}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env.sandbox
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      APP_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sandbox-audio-data:/app/storage/audio
    ports:
      - "127.0.0.1:${BACKEND_PORT}:4000"

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the published frontend image}:${FRONTEND_TAG:?Set FRONTEND_TAG to an immutable published tag}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"

volumes:
  sandbox-postgres-data:
  sandbox-audio-data:
